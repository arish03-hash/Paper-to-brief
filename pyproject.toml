[project]
name = "paper-to-brief"
version = "0.1.0"
description = "A deep research agent that turns a question into a cited brief."
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "deepagents>=0.7.23",
    "langchain>=1.4.4",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.7.0",
    "langgraph-cli[inmem]>=0.4.33",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

# Makes src/brief an installable package, so `from brief.tools import ...`
# works from run.py, LangGraph Studio and anywhere else. Run `uv sync` once after this.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brief"]
